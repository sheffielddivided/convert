name: Update nb.html data

on:
  schedule:
    - cron: "0 21 * * 1-5"   # hverdager kl. 21:00 UTC (etter at NB og US Treasury har publisert)
  workflow_dispatch:          # kan også kjøres manuelt fra GitHub

permissions:
  contents: write             # trengs for å pushe JSON-filene tilbake

concurrency:
  group: update-nb-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch data
        id: fetch
        continue-on-error: true   # delvis feil skal ikke hindre commit av det som lyktes
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scrapers/nb-data.js

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nb/
          git diff --cached --quiet || git commit -m "chore: update nb.html data [skip ci]"
          git pull --rebase
          git push

      - name: Fail if some source failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
